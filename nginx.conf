server {
    listen 80;
    server_name globalhawk.us www.globalhawk.us localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/octet-stream;

    # NOTE: no custom `types {}` block here. nginx's default mime.types
    # (included by the base image's main config) already covers html/css/
    # js/json/images correctly, and any unmapped extension -- including
    # .stl -- already falls back to the main config's `default_type
    # application/octet-stream`. Redeclaring `types {}` in this server
    # block would REPLACE, not extend, the inherited mime table, breaking
    # every other content type (this was a real bug caught in testing --
    # index.html was being served as application/octet-stream).

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Presenter-beacon presence API (shared "now showing" state)
    location /api/ {
        proxy_pass http://presence:8090/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Long cache ONLY for large, rarely-changed binary assets (video clips,
    # photos). js/css/html are deliberately excluded and always revalidate
    # (see location / above) -- this app is under active iteration, and an
    # earlier version of this rule caching app.js for 7 days meant browsers
    # kept running stale JS after every rebuild, with no error to show for
    # it. Bump a version query string (e.g. app.js?v=2) if a browser still
    # won't let go of an old cached copy after this fix.
    location ~* \.(jpg|jpeg|png|gif|ico|mp4)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
